services:
  - type: web
    name: nexaptra
    runtime: python
    plan: free
    region: oregon
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
    autoDeploy: true
